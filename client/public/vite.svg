<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with glowing shadow -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Rocket Body and Flame -->
  <g transform="translate(14, 14) scale(0.56)" filter="url(#glow)">
    <!-- Exhaust Plume -->
    <path d="M12 48 C 14 54, 18 60, 22 62 C 20 56, 20 52, 22 48 Z" fill="#f59e0b" opacity="0.9"/>
    <path d="M14 48 C 15 52, 17 56, 20 58 C 18 54, 18 51, 19 48 Z" fill="#ef4444"/>

    <!-- Left Wing -->
    <path d="M16 34 L6 42 C 4 44, 4 48, 8 48 L18 46 Z" fill="#c7d2fe"/>

    <!-- Right Wing -->
    <path d="M34 16 L42 6 C 44 4, 48 4, 48 8 L46 18 Z" fill="#c7d2fe"/>

    <!-- Main Rocket Fuselage -->
    <path d="M48 6 C 42 12, 22 24, 16 38 C 14 42, 16 46, 20 48 C 24 50, 28 48, 32 46 C 46 40, 58 20, 64 14 C 64 8, 54 6, 48 6 Z" fill="#ffffff"/>

    <!-- Rocket Window Porthole -->
    <circle cx="38" cy="24" r="6" fill="#06b6d4"/>
    <circle cx="37" cy="23" r="4.5" fill="#0b0f19"/>
    <circle cx="39" cy="22" r="1.8" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Sparkles -->
  <circle cx="48" cy="46" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="16" cy="18" r="1.5" fill="#ffffff" opacity="0.7"/>
</svg>
